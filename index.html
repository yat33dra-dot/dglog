<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Atomic Daygamer 2.0</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f9fafb">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f9fafb;color:#111;font:14px system-ui,-apple-system,sans-serif}
#v{max-width:440px;margin:0 auto}.pg{padding:14px 14px 96px}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.r{display:flex;justify-content:space-between;align-items:center}
.card{background:#fff;border-radius:16px;box-shadow:0 1px 2px #0001;padding:12px;margin-bottom:10px}
h1{font-size:22px;margin:0}h2{font-size:14px;margin:0 0 8px}
.top{margin-bottom:10px}.top b{font-size:15px}.scr{color:#4b5563}.scr b{font-size:20px;color:#111}
.chip{background:#f3f4f6;border:0;border-radius:99px;padding:7px 10px;font-size:12.5px;font-weight:500;color:#111}
.chip.on{background:#111;color:#fff}
.meta{display:flex;gap:8px;margin-bottom:8px}.meta input{background:#f3f4f6;border:0;border-radius:10px;padding:8px 10px;font-weight:600;font-size:13px;min-width:0}
.pl{width:100%;border:1px solid #e5e7eb;border-radius:12px;padding:11px;font-size:14px;margin-bottom:8px}
.chs{display:flex;flex-wrap:wrap;gap:6px}
.big{display:block;width:100%;border:0;border-radius:18px;color:#fff;font-weight:700;font-size:16px;padding:13px 0;letter-spacing:.3px}
.big.st{background:#111;margin-bottom:12px}.big.sv{background:#528a61;padding:12px 0}.big.off{opacity:.35}
.tl{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.tl>div{border-radius:12px;padding:6px 3px;text-align:center}
.tl .a{grid-column:span 2}.tl .b{grid-column:span 3}
.tl i{font-style:normal;font-size:9px;font-weight:700;display:block}.tl b{font-size:23px;display:block;line-height:1.15}
.tl small{font-size:8px;opacity:.8;display:block;margin-bottom:4px}.tl p{display:flex;gap:5px;justify-content:center;margin:0}
.tl button{width:26px;height:25px;border:0;border-radius:8px;background:#fff;color:#333;font-size:15px;font-weight:700;padding:0}
.tl button.m{background:#ffffff40;color:inherit}.tl button:disabled{opacity:.4}.tl button:active{transform:scale(.92)}
.tl>div{padding:6px 7px 7px}.tl i small{display:inline;font-size:9px;margin:0 0 0 4px;opacity:.8;font-weight:500}.tl p{justify-content:space-between;align-items:center}.tl p b{font-size:22px;display:block;line-height:1}.tl button{width:32px;height:30px}
.d{cursor:pointer}.bk{position:fixed;inset:0;background:#0006;z-index:40}
.sh{position:fixed;left:0;right:0;bottom:0;max-width:440px;margin:0 auto;background:#fff;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));z-index:41;max-height:78vh;overflow:auto}
.ssn{background:#f9fafb;border-radius:14px;padding:10px;margin-bottom:8px}.ssn .cn{font-size:12px;color:#4b5563;margin:4px 0}.ssn .pv{font-size:12px;color:#6b7280;white-space:pre-wrap;max-height:3.3em;overflow:hidden}
.er2{display:flex;gap:8px;margin-top:8px}.er2 button{flex:1;border:0;border-radius:10px;padding:9px;background:#e5e7eb;font-weight:600;font-size:13px}.er2 .dl{background:#fde8e6;color:#db6256}
.ob{display:block;width:100%;border:0;border-radius:12px;padding:13px;margin-bottom:8px;background:#f3f4f6;font-weight:600;font-size:14px}
.ad{display:block;width:100%;border:1px dashed #9ca3af;background:none;border-radius:12px;padding:11px;font-weight:600;color:#4b5563}
.lock{opacity:.4;pointer-events:none}
.lp{display:flex;flex-direction:column;height:calc(100dvh - 64px - env(safe-area-inset-bottom));padding:12px 12px 6px}
body.typing .lp{height:100dvh}body.typing nav{display:none}
.ed{flex:1;min-height:110px;margin-top:10px;background:#fff;border-radius:16px;padding:12px;font-size:17px;line-height:1.55;color:#374151;overflow:auto;white-space:pre-wrap;word-break:break-word;caret-color:#2563eb;outline:none;box-shadow:0 1px 2px #0001}
.ed:empty::before{content:attr(data-ph);color:#9ca3af}
.dock{display:flex;flex-wrap:wrap;gap:5px;padding:8px 0 6px}.dock .e{padding:3px 7px;font-size:17px}
.mh{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:4px 8px}
.mh button{border:0;background:none;font-size:16px;color:#6b7280}.mh span{min-width:104px;text-align:center;font-weight:600;font-size:13px}
.cal{background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;margin-bottom:14px}
.g7{display:grid;grid-template-columns:repeat(7,1fr)}.dow div{padding:9px 0;text-align:center;font-size:11px;font-weight:700;color:#9ca3af;border-bottom:1px solid #e5e7eb}
.days{gap:1px;background:#f0f1f2}.d{background:#fff;height:80px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:500;color:#374151}
.d.now{font-weight:800;color:#82b1e6;box-shadow:inset 0 0 0 1px #82b1e6}
.x{margin-top:auto;display:flex;flex-direction:column;align-items:center;height:42px;justify-content:flex-end}
.x u{text-decoration:none;color:#db6256;font-weight:800;font-size:18px;line-height:1}.x s{display:flex;gap:3px;margin-top:3px}.x i{width:6px;height:6px;border-radius:50%;background:#111;display:block}
.x em{font-style:normal;font-size:9px;color:#9ca3af;margin-top:2px}
.er{display:flex;gap:8px;margin:8px 0}.er div{flex:1;font-size:11px;color:#6b7280}.er input{width:100%;background:#f9fafb;border:1px solid #f0f1f2;border-radius:10px;padding:8px;margin-top:2px}
.eb{display:grid;grid-template-columns:1fr 1fr;gap:8px}.eb button,.eb label{border:1px solid #e5e7eb;background:#fff;border-radius:12px;padding:11px 4px;font-size:13px;font-weight:600;text-align:center;color:#374151}
.eb .a{background:#528a61;color:#fff;border:0}.eb .c{background:#82b1e6;color:#fff;border:0}.eb .k{background:#4b5563;color:#fff;border:0}.eb .w{grid-column:1/3;color:#db6256;border-color:#fecaca}
.row2{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid #f0f1f2}.row2.f{border:0}
.pc{min-width:48px;text-align:center;border-radius:8px;padding:4px 8px;font-size:12px;font-weight:700}
.stp{display:flex;align-items:center;gap:8px}.stp button{width:30px;height:30px;border:0;border-radius:8px;background:#f3f4f6;font-size:17px}.stp b{min-width:30px;text-align:center;font-size:15px}
.mk{display:grid;grid-template-columns:repeat(4,1fr);margin-top:10px;background:#f9fafb;border-radius:12px;padding:10px 4px;text-align:center;font-size:11px;color:#6b7280}
.mk u{text-decoration:none;display:block;color:#db6256;font-weight:800;font-size:17px}.mk s{display:flex;gap:3px;justify-content:center;height:8px;margin:2px 0 3px}.mk i{width:6px;height:6px;border-radius:50%;background:#111;display:block}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;padding:7px 0 calc(10px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;border:0;background:none;color:#9ca3af;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button span{font-size:19px}nav button.on{color:#528a61}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:9px 18px;border-radius:99px;font-size:13px;z-index:30;display:none;max-width:90%;text-align:center}
#cel{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:center;justify-content:center}
#cel canvas{position:absolute;inset:0;width:100%;height:100%}
#cel .cd{position:relative;text-align:center;padding:26px 28px;border-radius:24px;margin:0}
</style></head>
<body>
<div id="v"></div><div id="toast"></div>
<nav><button data-a="go" data-v="log"><span>📋</span>LOG</button><button data-a="go" data-v="stats"><span>📊</span>STATS</button><button data-a="go" data-v="sco"><span>⚙️</span>SCORING</button></nav>
<script src="app.js"></script>
</body></html>
